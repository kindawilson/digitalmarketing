<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Goals — Preview</title><style>
.integrated-activity{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:14px 0 0;font-family:Arial,Helvetica,sans-serif;color:#102f3a}
.integrated-top-composition{display:grid;grid-template-columns:170px minmax(0,1fr);grid-template-areas:"try title" "subtitle subtitle";column-gap:18px;row-gap:10px;align-items:start;padding:16px 18px 14px;border:1px solid #dfe3e6;border-top:6px solid #ddaf4b;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#f5f6f7 0%,#fff 72%)}
.integrated-try-row{grid-area:try;display:flex;align-items:flex-start;margin:0;padding:0 2px 0 0}
.integrated-try-badge{display:inline-flex;align-items:center;gap:13px;min-height:54px;padding:8px 13px 8px 20px;border:4px solid #ddaf4b;border-radius:4px;background:#1d627b;box-shadow:0 2px 0 rgba(16,47,58,.16);color:#fff;font-family:"Century Gothic","Aptos Display","Segoe UI",Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:.08em;line-height:1;text-transform:uppercase;animation:integratedBadgePulse 2.2s ease-in-out infinite}
.integrated-cursor{width:22px;height:27px;color:#ddaf4b;filter:drop-shadow(1px 1px 0 rgba(16,47,58,.32));animation:integratedCursorTap 2.2s ease-in-out infinite}
.integrated-title-wrap{grid-area:title;min-width:0;padding-top:1px}
.integrated-eyebrow{margin:0 0 3px;color:#1d627b;font-family:"Century Gothic","Aptos Display","Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.15em;line-height:1.2;text-transform:uppercase}
.integrated-title{margin:0!important;padding:0!important;color:#1d627b!important;font-family:"Century Gothic","Aptos Display","Segoe UI",Arial,sans-serif!important;font-size:clamp(25px,5vw,32px)!important;font-weight:700!important;letter-spacing:.01em!important;line-height:1.08!important;text-transform:uppercase!important;overflow-wrap:anywhere}
.integrated-subtitle{grid-area:subtitle;width:100%;margin:0;color:#4d5259;font-size:15px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
@keyframes integratedBadgePulse{0%,20%,100%{transform:scale(1)}40%{transform:scale(1.025)}58%{transform:scale(1)}}
@keyframes integratedCursorTap{0%,20%,65%,100%{transform:translate(0,0)}36%{transform:translate(3px,2px)}48%{transform:translate(0,0)}}
@media(max-width:700px){.integrated-activity{width:min(100% - 18px,1120px);padding-top:10px}.integrated-top-composition{grid-template-columns:1fr;grid-template-areas:"try" "title" "subtitle";gap:6px;padding:12px 14px}.integrated-title{font-size:clamp(24px,7vw,30px)!important}.integrated-subtitle{font-size:14px}.integrated-try-badge{min-height:48px;padding:7px 11px 7px 16px;font-size:16px}}
@media(prefers-reduced-motion:reduce){.integrated-try-badge,.integrated-cursor{animation:none!important}}


*{box-sizing:border-box}body{margin:0;background:#fff;color:#17324d;font-family:Lato,Arial,sans-serif}.integrated-subtitle{font-family:Lato,Arial,sans-serif}.content{width:min(1120px,calc(100% - 28px));margin:auto;border:1px solid #dfe3e6;border-top:0;padding:20px;background:#fff}.instruction{margin:0 0 14px;font-size:16px;line-height:1.45;color:#4d5259}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{font:700 15px Lato,Arial,sans-serif;line-height:1.3;text-align:left;color:#164c60;background:white;border:2px solid #1d627b;border-radius:4px;padding:10px 13px;cursor:pointer}.choices button[aria-pressed="true"]{background:#1d627b;color:#fff;box-shadow:inset 0 -3px #ddaf4b}.choices button:focus-visible{outline:3px solid #ddaf4b;outline-offset:2px}.detail{margin-top:18px;padding:18px 20px;border-left:6px solid #ddaf4b;background:#f5f6f7}.detail h2{margin:0 0 8px;font:700 21px "Century Gothic",Arial,sans-serif;color:#1d627b}.detail p{margin:0;font-size:17px;line-height:1.5;color:#303b42}@media(max-width:700px){.content{width:calc(100% - 18px);padding:14px}.choices{gap:6px}.choices button{font-size:14px}.detail{padding:15px}.detail p{font-size:16px}}</style><style>.goal-layout{display:grid;grid-template-columns:minmax(220px,0.9fr) minmax(0,1.4fr);gap:18px;align-items:start}.choices{display:grid;grid-template-columns:1fr;gap:6px}.choices button{width:100%}.detail{margin-top:0;min-height:160px}.detail h2{overflow-wrap:anywhere}@media(max-width:600px){.goal-layout{grid-template-columns:1fr;gap:14px}.detail{min-height:0}}</style></head><body><section class="integrated-activity" aria-label="Interactive learning activity"><div class="integrated-top-composition"><div class="integrated-try-row" aria-label="Try this interactive activity"><div class="integrated-try-badge"><span>Try This</span><svg class="integrated-cursor" viewBox="0 0 24 30" aria-hidden="true"><path fill="currentColor" d="M2 1.3v24.4l6.2-5 4.4 8.1 4.2-2.3-4.4-8.1 7.8-1.2L2 1.3Z"/></svg></div></div><div class="integrated-title-wrap"><p class="integrated-eyebrow">Interactive Learning</p><h1 class="integrated-title">Social Media Content Goals</h1></div><p class="integrated-subtitle">Select a goal to see how social media content can support it.</p></div></section><main class="content"><p class="instruction">Choose a goal to read its description.</p><div class="goal-layout"><div class="choices" aria-label="Social media content goals"><button type="button" data-index="0" aria-pressed="true">Increase brand awareness</button><button type="button" data-index="1" aria-pressed="false">Increase top-of-mind awareness</button><button type="button" data-index="2" aria-pressed="false">Build community</button><button type="button" data-index="3" aria-pressed="false">Build customer relationship</button><button type="button" data-index="4" aria-pressed="false">Brand / rebrand (see also: building credibility / expertise)</button><button type="button" data-index="5" aria-pressed="false">Improve customer service</button><button type="button" data-index="6" aria-pressed="false">Gain customer insight</button><button type="button" data-index="7" aria-pressed="false">Establish expertise / credibility</button><button type="button" data-index="8" aria-pressed="false">Increase sales</button></div><section class="detail" aria-live="polite"><h2 id="goal-title"></h2><p id="goal-description"></p></section></div></main><script>const items=[{"label": "Increase brand awareness", "description": "any content that gains traction can organically increase brand awareness. This includes humorous posts, inspirational, etc."}, {"label": "Increase top-of-mind awareness", "description": "simply being seen regularly on social media can increase top-of-mind awareness. Therefore, if you post regularly, and it gets engagement enough to be seen organically, you’re helping to establish top-of-mind awareness"}, {"label": "Build community", "description": "platforms and content that encourages communication between customers helps to build community"}, {"label": "Build customer relationship", "description": "content that answers questions, helps gain customer insight, or increases engagement between the company and customer helps to build a relationship"}, {"label": "Brand / rebrand (see also: building credibility / expertise)", "description": "content that showcases salient product attributes, product quality, the process of product research/creation, showcasing employees, or even showing customer feedback all tell the customer something about your product/service quality."}, {"label": "Improve customer service", "description": "answering customer complaints on social media in a very timely matter helps strengthen customer service."}, {"label": "Gain customer insight", "description": "customer feedback on social media (and social listening) helps give us insight into what customers value. We can use posts to run polls and get feedback for how to adjust products or even which products to offer in the future! (Some clothing companies are now doing polls with customers before purchasing the next season’s styles - to see which appeals to buyers. I’ve seen them have live social media videos from buyers’ markets to ask about specific clothing items!)"}, {"label": "Establish expertise / credibility", "description": "(see note above on branding)"}, {"label": "Increase sales", "description": "we can also do a direct sales push on social media, although this should be done sparingly. Aim for 80%+ of your content to be other content that’s not a direct call to action - even showcasing products."}];const buttons=document.querySelectorAll("[data-index]");function show(i){buttons.forEach((b,n)=>b.setAttribute("aria-pressed",String(i===n)));document.getElementById("goal-title").textContent=items[i].label;document.getElementById("goal-description").textContent=items[i].description}buttons.forEach((b,i)=>b.addEventListener("click",()=>show(i)));show(0);function resize(){const main=document.querySelector("main");parent.postMessage({type:"vanderbilt-iframe-height",height:Math.ceil(main.getBoundingClientRect().bottom+window.scrollY+8)},"*")}const observer=new ResizeObserver(resize);observer.observe(document.querySelector("main"));observer.observe(document.querySelector(".integrated-activity"));window.addEventListener("load",resize);</script></body></html>
