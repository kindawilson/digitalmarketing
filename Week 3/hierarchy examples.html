<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hierarchy Examples</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#30383d;font-family:Arial,"Apex New",sans-serif}.wrap{width:100%;border:1px solid #d9e3e7;background:#fff}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid #d9e3e7;background:#fff;color:#111}h1{margin:0;font-family:Arial,"Apex New",sans-serif;font-size:clamp(20px,4vw,26px);font-weight:700;line-height:1.2;text-transform:none}.count{flex:0 0 auto;color:#4d5259;font-size:16px;white-space:nowrap}.viewport{position:relative;padding:14px 50px 8px;background:#f5f6f7}.slide{display:none;margin:0}.slide.active{display:block}.image-stage{display:grid;height:330px;place-items:center;padding:10px;background:#fff}img{display:block;max-width:100%;max-height:100%;object-fit:contain}figcaption{padding:11px 8px 6px;text-align:center;line-height:1.35}figcaption strong,figcaption span{display:block}figcaption span{margin-top:3px;font-size:13px}.arrow{position:absolute;top:155px;width:38px;height:48px;border:0;border-radius:4px;background:#1d627b;color:#fff;font-size:27px;cursor:pointer}.arrow:hover,.arrow:focus{background:#0f3f52}.prev{left:6px}.next{right:6px}.dots{display:flex;justify-content:center;gap:9px;padding:10px 12px 14px;background:#f5f6f7}.dot{width:13px;height:13px;padding:0;border:2px solid #1d627b;border-radius:50%;background:#fff;cursor:pointer}.dot.active{background:#ddaf4b}.instructions{margin:0;padding:14px 18px 16px;border-top:1px solid #d9e3e7;font-size:17px;line-height:1.45;text-align:center}button:focus-visible{outline:4px solid #ddaf4b;outline-offset:3px}@media(max-width:480px){header{padding:13px 14px 12px}.viewport{padding:10px 42px 6px}.image-stage{height:270px;padding:6px}.arrow{top:122px;width:34px;height:46px}.instructions{font-size:16px}}</style></head><body><section class="wrap" aria-roledescription="carousel" aria-label="Hierarchy Examples"><header><h1>Hierarchy Examples</h1><span class="count" aria-live="polite">1 of 3</span></header><div class="viewport"><button class="arrow prev" type="button" aria-label="Previous example">‹</button><figure class="slide active" data-index="0" aria-hidden="false"><div class="image-stage"><img src="hierarchy-example-1.jpg" alt="A graphic using scale and position to establish visual hierarchy."></div><figcaption><strong>Hierarchy through scale</strong><span>Source: Adobe Express</span></figcaption></figure><figure class="slide" data-index="1" aria-hidden="true"><div class="image-stage"><img src="hierarchy-example-2.jpg" alt="A promotional graphic using a dominant headline and smaller supporting copy."></div><figcaption><strong>Hierarchy through emphasis</strong><span>Source: Adobe Express</span></figcaption></figure><figure class="slide" data-index="2" aria-hidden="true"><div class="image-stage"><img src="hierarchy-example-3.jpg" alt="A graphic using contrast and placement to guide attention."></div><figcaption><strong>Hierarchy through contrast</strong><span>Source: Adobe Express</span></figcaption></figure><button class="arrow next" type="button" aria-label="Next example">›</button></div><div class="dots"><button class="dot active" type="button" aria-label="Show example 1" aria-current="true" data-go="0"></button><button class="dot" type="button" aria-label="Show example 2" aria-current="false" data-go="1"></button><button class="dot" type="button" aria-label="Show example 3" aria-current="false" data-go="2"></button></div><p class="instructions">Select the arrow buttons or dots, or use the left and right arrow keys to explore the examples.</p></section><script>const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];let current=0;function show(n){current=(n+slides.length)%slides.length;slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true')});dots.forEach((d,i)=>{d.classList.toggle('active',i===current);d.setAttribute('aria-current',i===current?'true':'false')});document.querySelector('.count').textContent=(current+1)+' of '+slides.length}document.querySelector('.prev').onclick=()=>show(current-1);document.querySelector('.next').onclick=()=>show(current+1);dots.forEach(d=>d.onclick=()=>show(+d.dataset.go));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});</script></body></html>
