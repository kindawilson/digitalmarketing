<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Image Carousel</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #5d6670;
      --line: #d8dde3;
      --surface: #ffffff;
      --soft: #f5f6f7;
      --accent: #c8a24a;
      --accent-dark: #806315;
      --focus: #0066cc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
      padding: clamp(10px, 2.5vw, 24px);
    }
    .carousel {
      width: min(100%, 1120px);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(31, 41, 51, .10);
      overflow: hidden;
      touch-action: pan-y;
    }
    .carousel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: clamp(1.05rem, 2.2vw, 1.35rem); color: #000; }
    .counter { color: var(--muted); font-size: .92rem; white-space: nowrap; }
    .viewport { position: relative; background: var(--soft); }
    .slide { margin: 0; }
    .image-frame {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 8.625;
      overflow: hidden;
      background: #e9ecef;
    }
    .image-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px 24px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .site-name { font-weight: 700; }
    .source { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .source a { color: #4c3a0b; text-underline-offset: 2px; }
    .source a:hover { color: #000; }
    .nav-button {
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 2px solid rgba(255,255,255,.92);
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 1.55rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      z-index: 2;
    }
    .nav-button:hover { background: #000; }
    .nav-button:focus-visible, .dot:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .previous { left: 12px; }
    .next { right: 12px; }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 13px 16px 16px;
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .dot {
      width: 12px;
      height: 12px;
      padding: 0;
      border: 1px solid #6b7280;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .dot[aria-current="true"] { background: var(--accent); border-color: var(--accent-dark); transform: scale(1.15); }
    .help {
      margin: 0;
      padding: 2px 20px 18px;
      color: #3f4852;
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
    }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      body { padding: 0; }
      .carousel { border-left: 0; border-right: 0; border-radius: 0; box-shadow: none; }
      .carousel-header, figcaption { padding-left: 14px; padding-right: 14px; }
      .carousel-header { gap: 10px; }
      .nav-button { width: 44px; height: 44px; font-size: 1.35rem; }
      .previous { left: 7px; }
      .next { right: 7px; }
      figcaption { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
    @media (max-width: 380px) {
      .carousel-header { align-items: flex-start; flex-direction: column; gap: 2px; }
      .counter { font-size: .88rem; }
      .source { font-size: .84rem; }
      .controls { gap: 9px; padding-bottom: 14px; }
      .help { padding-left: 14px; padding-right: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .slide:not([hidden]) { animation: reveal .18s ease-out; }
      @keyframes reveal { from { opacity: .35; } to { opacity: 1; } }
    }
  </style>
</head>

  <script>
    (() => {
      const carousel = document.querySelector('.carousel');
      const slides = [...document.querySelectorAll('.slide')];
      const dots = [...document.querySelectorAll('.dot')];
      const current = document.getElementById('current');
      let index = 0;

      function show(next) {
        index = (next + slides.length) % slides.length;
        slides.forEach((slide, i) => {
          const active = i === index;
          slide.hidden = !active;
          slide.setAttribute('aria-hidden', String(!active));
        });
        dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === index)));
        current.textContent = String(index + 1);
      }

      document.querySelector('.previous').addEventListener('click', () => show(index - 1));
      document.querySelector('.next').addEventListener('click', () => show(index + 1));
      dots.forEach(dot => dot.addEventListener('click', () => show(Number(dot.dataset.slide))));
      carousel.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); show(index - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); show(index + 1); }
      });

      let startX = null;
      carousel.addEventListener('pointerdown', event => { startX = event.clientX; });
      carousel.addEventListener('pointerup', event => {
        if (startX === null) return;
        const distance = event.clientX - startX;
        if (Math.abs(distance) > 60) show(index + (distance < 0 ? 1 : -1));
        startX = null;
      });
    })();
  </script>
