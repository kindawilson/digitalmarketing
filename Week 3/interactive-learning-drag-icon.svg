<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Interactive drag activity</title>
  <desc id="desc">A mouse pointer repeatedly drags a gold object toward a teal target.</desc>
  <style>
    :root { --teal:#1d627b; --gold:#ddaf4b; --charcoal:#4d5259; --soft:#f5f6f7; }
    .frame { fill:#fff; stroke:var(--teal); stroke-width:3; }
    .track { fill:var(--soft); stroke:#c8d2d6; stroke-width:2; }
    .target { fill:none; stroke:var(--teal); stroke-width:3; stroke-dasharray:5 4; }
    .target-dot { fill:var(--teal); opacity:.18; }
    .drag-group { animation:drag 2.6s ease-in-out infinite; }
    .object { fill:var(--gold); stroke:#9c741a; stroke-width:2; }
    .cursor { fill:#fff; stroke:var(--charcoal); stroke-width:2.5; stroke-linejoin:round; }
    .click-ring { fill:none; stroke:var(--gold); stroke-width:3; opacity:0; animation:click 2.6s ease-in-out infinite; }
    .motion { fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round; opacity:0; animation:motion 2.6s ease-in-out infinite; }
    @keyframes drag {
      0%,15% { transform:translate(0,0); }
      28% { transform:translate(2px,1px); }
      68%,80% { transform:translate(46px,0); }
      100% { transform:translate(0,0); }
    }
    @keyframes click {
      0%,14%,35%,100% { opacity:0; transform:scale(.55); transform-origin:42px 67px; }
      20%,27% { opacity:1; transform:scale(1); transform-origin:42px 67px; }
    }
    @keyframes motion {
      0%,25%,75%,100% { opacity:0; }
      36%,62% { opacity:1; }
    }
    @media (prefers-reduced-motion:reduce) {
      .drag-group,.click-ring,.motion { animation:none; }
      .drag-group { transform:translate(46px,0); }
    }
  </style>
  <rect class="frame" x="10" y="19" width="100" height="82" rx="12"/>
  <rect class="track" x="23" y="53" width="74" height="29" rx="14.5"/>
  <circle class="target-dot" cx="82" cy="67.5" r="11"/>
  <circle class="target" cx="82" cy="67.5" r="12"/>
  <path class="motion" d="M53 43h20M68 37l6 6-6 6"/>
  <g class="drag-group">
    <rect class="object" x="27" y="56" width="24" height="23" rx="6"/>
    <circle class="click-ring" cx="42" cy="67" r="15"/>
    <path class="cursor" d="M39 62v31l8-8 6 13 7-4-7-13h12z"/>
  </g>
</svg>
