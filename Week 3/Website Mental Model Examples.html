<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Mental Model Examples</title>
  <style>
    :root { --ink:#1f2933; --muted:#5d6670; --line:#d8dde3; --soft:#f5f6f7; --accent:#c8a24a; --accent-dark:#806315; --focus:#0066cc; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:transparent; overflow-x:hidden; }
    body { color:var(--ink); font-family:Arial,Helvetica,sans-serif; line-height:1.45; padding:clamp(8px,2vw,18px); }
    .carousel { width:min(100%,860px); margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 7px 20px rgba(31,41,51,.09); overflow:hidden; touch-action:pan-y; }
    .carousel-header { display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:14px 18px 11px; border-bottom:1px solid var(--line); }
    h2 { margin:0; color:#000; font-size:clamp(1.02rem,2.2vw,1.28rem); }
    .counter { color:var(--muted); font-size:.9rem; white-space:nowrap; }
    .viewport { position:relative; background:var(--soft); }
    .slide { margin:0; }
    .image-frame { display:grid; place-items:center; width:100%; aspect-ratio:16/7.5; overflow:hidden; background:#eceff1; }
    .image-frame img { display:block; width:100%; height:100%; object-fit:contain; }
    figcaption { display:flex; align-items:flex-start; justify-content:space-between; gap:10px 22px; flex-wrap:wrap; padding:11px 18px; background:#fff; border-top:1px solid var(--line); }
    .site-name { display:block; font-weight:700; }
    .carousel-header > *, figcaption > * { min-width:0; max-width:100%; }
    .description { display:block; color:var(--muted); font-size:.9rem; margin-top:2px; overflow-wrap:anywhere; }
    .source { color:var(--muted); font-size:.86rem; overflow-wrap:anywhere; }
    .source a { color:#4c3a0b; text-underline-offset:2px; }
    .nav-button { position:absolute; top:44%; transform:translateY(-50%); display:grid; place-items:center; width:46px; height:46px; border:3px solid #ddaf4b; border-radius:50%; background:rgba(0,0,0,.82); color:#fff; font-size:1.45rem; line-height:1; cursor:pointer; box-shadow:0 0 0 3px rgba(255,255,255,.96),0 3px 12px rgba(0,0,0,.34); z-index:2; }
    .nav-button:hover { background:#000; border-color:#f2c85b; }
    .previous { left:10px; } .next { right:10px; }
    .controls { display:flex; justify-content:center; align-items:center; gap:10px; padding:12px 14px 13px; background:#fff; border-top:1px solid var(--line); }
    .dot { width:12px; height:12px; padding:0; border:1px solid #6b7280; border-radius:50%; background:#fff; cursor:pointer; }
    .dot[aria-current="true"] { background:var(--accent); border-color:var(--accent-dark); transform:scale(1.15); }
    .help { width:100%; margin:0; padding:2px 18px 16px; color:#3f4852; font-size:1rem; line-height:1.5; text-align:center; overflow-wrap:anywhere; }
    .nav-button:focus-visible,.dot:focus-visible,a:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    [hidden] { display:none!important; }
    @media (max-width:640px) {
      body { padding:0; }
      .carousel { border-left:0; border-right:0; border-radius:0; box-shadow:none; }
      .carousel-header,figcaption { padding-left:14px; padding-right:14px; }
      figcaption { flex-direction:column; gap:5px; }
      .previous { left:7px; } .next { right:7px; }
    }
    @media (max-width:380px) {
      .carousel-header { align-items:flex-start; flex-direction:column; gap:2px; }
      .source,.description { font-size:.83rem; }
      .help { padding-left:14px; padding-right:14px; }
    }
    @media (prefers-reduced-motion:no-preference) { .slide:not([hidden]) { animation:reveal .18s ease-out; } @keyframes reveal { from { opacity:.35; } to { opacity:1; } } }
  </style>
</head>

  <script>
    (() => {
      const carousel=document.querySelector('.carousel'); const slides=[...document.querySelectorAll('.slide')]; const dots=[...document.querySelectorAll('.dot')]; const current=document.getElementById('current'); let index=0;
      function show(next) { index=(next+slides.length)%slides.length; slides.forEach((slide,i)=>{const active=i===index; slide.hidden=!active; slide.setAttribute('aria-hidden',String(!active));}); dots.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===index))); current.textContent=String(index+1); }
      document.querySelector('.previous').addEventListener('click',()=>show(index-1)); document.querySelector('.next').addEventListener('click',()=>show(index+1)); dots.forEach(dot=>dot.addEventListener('click',()=>show(Number(dot.dataset.slide))));
      carousel.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();show(index-1);} if(event.key==='ArrowRight'){event.preventDefault();show(index+1);}});
      let startX=null; carousel.addEventListener('pointerdown',event=>{startX=event.clientX;}); carousel.addEventListener('pointerup',event=>{if(startX===null)return; const distance=event.clientX-startX; if(Math.abs(distance)>60)show(index+(distance<0?1:-1)); startX=null;});
    })();
  </script>
