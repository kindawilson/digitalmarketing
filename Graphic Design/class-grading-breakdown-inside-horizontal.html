<div id="vanderbilt-grading-inside-horizontal">
  <svg class="vgh-chart" viewBox="0 0 800 800" role="img" aria-labelledby="vgh-title vgh-desc">
    <title id="vgh-title">Class grading percentage breakdown with labels inside each slice</title>
    <desc id="vgh-desc">Participation is 8.3 percent, Quizzes are 16.7 percent, Individual Assignments are 25 percent, Team Assignments are 16.7 percent, and Final Project is 33.3 percent. Every category and percentage is written horizontally inside its corresponding slice.</desc>
    <g id="vgh-slices"></g>
    <g id="vgh-labels"></g>
  </svg>
</div>

<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #vanderbilt-grading-inside-horizontal {
    --class-blue: #1d627b;
    --class-gold: #ddaf4b;
    --class-red: #b03d19;
    --class-sky: #59a4d4;
    --class-teal: #00a080;
    width: 100%;
  }
  #vanderbilt-grading-inside-horizontal .vgh-chart {
    display: block;
    width: 100%;
    height: auto;
  }
  #vanderbilt-grading-inside-horizontal .vgh-name,
  #vanderbilt-grading-inside-horizontal .vgh-pct {
    font-family: Aptos, "Aptos Display", Arial, sans-serif;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
  #vanderbilt-grading-inside-horizontal .vgh-name { font-size: 27px; }
  #vanderbilt-grading-inside-horizontal .vgh-pct { font-size: 27px; }
  #vanderbilt-grading-inside-horizontal .vgh-outside {
    fill: #000000;
    font-family: Aptos, "Aptos Display", Arial, sans-serif;
    font-size: 21px;
    font-weight: 600;
    text-anchor: start;
    dominant-baseline: middle;
  }
  #vanderbilt-grading-inside-horizontal .vgh-leader {
    fill: none;
    stroke: #000000;
    stroke-width: 2;
  }
</style>

<script>
(() => {
  const root = document.getElementById('vanderbilt-grading-inside-horizontal');
  const data = [
    ['Participation', 25, 'var(--class-red)', 452, 172],
    ['Quizzes', 50, 'var(--class-gold)', 570, 250],
    ['Individual Assignments', 75, 'var(--class-blue)', 555, 520],
    ['Team Assignments', 50, 'var(--class-sky)', 270, 530],
    ['Final Project', 100, 'var(--class-teal)', 225, 260]
  ];
  const total = data.reduce((sum, item) => sum + item[1], 0);
  const slices = root.querySelector('#vgh-slices');
  const labels = root.querySelector('#vgh-labels');
  const cx = 400;
  const cy = 400;
  const radius = 320;
  const polar = (angle, r) => [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  const formatPct = value => Number.isInteger(value) ? `${value}%` : `${value.toFixed(1)}%`;
  const addLabel = (text, x, y) => {
    const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    nameText.setAttribute('x', x);
    nameText.setAttribute('y', y);
    nameText.setAttribute('fill', '#ffffff');
    nameText.setAttribute('class', 'vgh-name');
    const lines = text === 'Individual Assignments' ? ['Individual', 'Assignments']
      : text === 'Team Assignments' ? ['Team', 'Assignments']
      : text === 'Final Project' ? ['Final', 'Project']
      : [text];
    lines.forEach((line, index) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', x);
      tspan.setAttribute('dy', index === 0 ? 0 : 32);
      tspan.textContent = line;
      nameText.appendChild(tspan);
    });
    labels.appendChild(nameText);
  };
  let angle = -Math.PI / 2;

  data.forEach(([name, points, color, labelX, pctY]) => {
    const pct = points / total * 100;
    const next = angle + (points / total) * Math.PI * 2;
    const middle = (angle + next) / 2;
    const [x1, y1] = polar(angle, radius);
    const [x2, y2] = polar(next, radius);
    const large = next - angle > Math.PI ? 1 : 0;

    const slice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    slice.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2} Z`);
    slice.setAttribute('fill', color);
    slice.setAttribute('tabindex', '0');
    slice.setAttribute('data-tooltip', `${name}: ${formatPct(pct)}`);
    slices.appendChild(slice);

    if (name === 'Participation') {
      addLabel('Partic.', labelX, pctY + 38);
    } else {
      addLabel(name, labelX, pctY + 38);
    }

    const pctText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    pctText.setAttribute('x', labelX);
    pctText.setAttribute('y', pctY);
    pctText.setAttribute('fill', '#ffffff');
    pctText.setAttribute('class', 'vgh-pct');
    pctText.textContent = formatPct(pct);
    labels.appendChild(pctText);

    angle = next;
  });
})();
</script>
