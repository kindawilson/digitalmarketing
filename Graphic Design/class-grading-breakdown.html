<div id="vanderbilt-grading-chart">
  <div class="vg-layout">
    <div class="vg-chart-wrap">
      <svg class="vg-chart" viewBox="0 0 360 360" role="img" aria-labelledby="vg-title vg-desc">
        <title id="vg-title">Pie chart of the class grading breakdown</title>
        <desc id="vg-desc">Five grading categories total 300 points and 100 percent. Individual Items account for 50 percent through Participation, Quizzes, and Individual Assignments. Team Items account for 50 percent through Team Assignments and the Final Project.</desc>
        <g id="vg-slices"></g>
      </svg>
    </div>
    <ol class="vg-legend" aria-label="Graded items and percentages" id="vg-legend"></ol>
  </div>
  <p class="vg-note">Individual Items: 50% &nbsp;•&nbsp; Team Items: 50%</p>
</div>

<style>
  #vanderbilt-grading-chart {
    --class-blue: #1d627b;
    --class-gold: #ddaf4b;
    --class-gray: #4d5259;
    --class-red: #b03d19;
    --class-sky: #59a4d4;
    --class-teal: #00a080;
    --class-light-gray: #e7e6e6;
    --class-black: #000000;
    color: var(--foreground);
    width: 100%;
  }
  #vanderbilt-grading-chart .vg-layout {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(280px, 1.15fr);
    gap: 1.5rem;
    align-items: center;
  }
  #vanderbilt-grading-chart .vg-chart-wrap { min-width: 0; }
  #vanderbilt-grading-chart .vg-chart { display: block; width: 100%; height: auto; max-height: 440px; }
  #vanderbilt-grading-chart .vg-slice { stroke: var(--background); stroke-width: 3; }
  #vanderbilt-grading-chart .vg-legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: .7rem;
  }
  #vanderbilt-grading-chart .vg-item {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr) auto;
    gap: .65rem;
    align-items: center;
  }
  #vanderbilt-grading-chart .vg-swatch { width: 14px; height: 14px; border-radius: 50%; }
  #vanderbilt-grading-chart .vg-name { color: var(--foreground); }
  #vanderbilt-grading-chart .vg-value { color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #vanderbilt-grading-chart .vg-note { margin: 1rem 0 0; color: var(--muted-foreground); text-align: center; }
  @media (max-width: 640px) {
    #vanderbilt-grading-chart .vg-layout { grid-template-columns: 1fr; gap: 1rem; }
    #vanderbilt-grading-chart .vg-chart { max-height: 330px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('vanderbilt-grading-chart');
  const data = [
    ['Participation', 25, 'var(--class-red)'],
    ['Quizzes', 50, 'var(--class-gold)'],
    ['Individual Assignments', 75, 'var(--class-blue)'],
    ['Team Assignments', 50, 'var(--class-sky)'],
    ['Final Project', 100, 'var(--class-teal)']
  ];
  const total = data.reduce((sum, item) => sum + item[1], 0);
  const slices = root.querySelector('#vg-slices');
  const legend = root.querySelector('#vg-legend');
  const polar = (angle, radius) => [180 + radius * Math.cos(angle), 180 + radius * Math.sin(angle)];
  let angle = -Math.PI / 2;
  data.forEach(([name, points, color]) => {
    const next = angle + (points / total) * Math.PI * 2;
    const [x1, y1] = polar(angle, 154);
    const [x2, y2] = polar(next, 154);
    const large = next - angle > Math.PI ? 1 : 0;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M 180 180 L ${x1} ${y1} A 154 154 0 ${large} 1 ${x2} ${y2} Z`);
    path.setAttribute('fill', color);
    path.setAttribute('class', 'vg-slice');
    path.setAttribute('tabindex', '0');
    path.setAttribute('data-tooltip', `${name}: ${points} points (${(points / total * 100).toFixed(1)}%)`);
    slices.appendChild(path);

    const item = document.createElement('li');
    item.className = 'vg-item';
    item.innerHTML = `<span class="vg-swatch" style="background:${color}" aria-hidden="true"></span><span class="vg-name">${name}</span><span class="vg-value">${points} pts · ${(points / total * 100).toFixed(1)}%</span>`;
    legend.appendChild(item);
    angle = next;
  });
})();
</script>
