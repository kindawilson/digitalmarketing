<div id="vanderbilt-grading-inside-chart">
  <svg class="vgi-chart" viewBox="0 0 1200 760" role="img" aria-labelledby="vgi-title vgi-desc">
    <title id="vgi-title">Class grading percentage breakdown with labels inside the pie</title>
    <desc id="vgi-desc">Participation is 8.3 percent, Quizzes are 16.7 percent, Individual Assignments are 25 percent, Team Assignments are 16.7 percent, and Final Project is 33.3 percent. Individual Items and Team Items each account for 50 percent.</desc>
    <g id="vgi-slices"></g>
    <g id="vgi-labels"></g>
    <text x="600" y="735" text-anchor="middle" class="vgi-summary">Individual Items: 50%  •  Team Items: 50%</text>
  </svg>
</div>

<style>
  #vanderbilt-grading-inside-chart {
    --class-blue: #1d627b;
    --class-gold: #ddaf4b;
    --class-red: #b03d19;
    --class-sky: #59a4d4;
    --class-teal: #00a080;
    --class-white: #ffffff;
    color: var(--foreground);
    width: 100%;
  }
  #vanderbilt-grading-inside-chart .vgi-chart {
    display: block;
    width: 100%;
    height: auto;
    max-height: 560px;
  }
  #vanderbilt-grading-inside-chart .vgi-slice {
    stroke: var(--background);
    stroke-width: 3;
  }
  #vanderbilt-grading-inside-chart .vgi-name,
  #vanderbilt-grading-inside-chart .vgi-pct,
  #vanderbilt-grading-inside-chart .vgi-outside-name {
    fill: var(--class-white);
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
  #vanderbilt-grading-inside-chart .vgi-name { font-size: 22px; }
  #vanderbilt-grading-inside-chart .vgi-pct { font-size: 27px; }
  #vanderbilt-grading-inside-chart .vgi-outside-name {
    fill: var(--class-blue);
    font-size: 22px;
    font-weight: 500;
  }
  #vanderbilt-grading-inside-chart .vgi-leader {
    fill: none;
    stroke: var(--class-blue);
    stroke-width: 3;
  }
  #vanderbilt-grading-inside-chart .vgi-summary {
    fill: var(--foreground);
    font-size: 21px;
  }
</style>

<script>
(() => {
  const root = document.getElementById('vanderbilt-grading-inside-chart');
  const data = [
    ['Participation', 25, 'var(--class-red)', 'outside-right'],
    ['Quizzes', 50, 'var(--class-gold)', 'inside'],
    ['Individual Assignments', 75, 'var(--class-blue)', 'outside-right'],
    ['Team Assignments', 50, 'var(--class-sky)', 'outside-left'],
    ['Final Project', 100, 'var(--class-teal)', 'inside']
  ];
  const total = data.reduce((sum, item) => sum + item[1], 0);
  const slices = root.querySelector('#vgi-slices');
  const labels = root.querySelector('#vgi-labels');
  const cx = 600;
  const cy = 350;
  const radius = 270;
  const polar = (angle, r) => [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  const formatPct = value => Number.isInteger(value) ? `${value}%` : `${value.toFixed(1)}%`;
  let angle = -Math.PI / 2;

  data.forEach(([name, points, color, placement]) => {
    const pct = points / total * 100;
    const next = angle + (points / total) * Math.PI * 2;
    const middle = (angle + next) / 2;
    const [x1, y1] = polar(angle, radius);
    const [x2, y2] = polar(next, radius);
    const large = next - angle > Math.PI ? 1 : 0;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2} Z`);
    path.setAttribute('fill', color);
    path.setAttribute('class', 'vgi-slice');
    path.setAttribute('tabindex', '0');
    path.setAttribute('data-tooltip', `${name}: ${formatPct(pct)}`);
    slices.appendChild(path);

    const [pctX, pctY] = polar(middle, 158);
    const pctText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    pctText.setAttribute('x', pctX);
    pctText.setAttribute('y', pctY + 6);
    pctText.setAttribute('class', 'vgi-pct');
    pctText.textContent = formatPct(pct);
    labels.appendChild(pctText);

    if (placement !== 'inside') {
      const [px, py] = polar(middle, radius - 3);
      const [ex, ey] = polar(middle, radius + 30);
      const isRight = placement === 'outside-right';
      const lineEndX = isRight ? 1010 : 190;
      const leader = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      leader.setAttribute('d', `M ${px} ${py} L ${ex} ${ey} L ${lineEndX} ${ey}`);
      leader.setAttribute('class', 'vgi-leader');
      labels.appendChild(leader);

      const outside = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      outside.setAttribute('x', isRight ? lineEndX + 22 : lineEndX - 22);
      outside.setAttribute('y', ey + 7);
      outside.setAttribute('class', 'vgi-outside-name');
      outside.setAttribute('text-anchor', isRight ? 'start' : 'end');
      outside.textContent = name;
      labels.appendChild(outside);
      angle = next;
      return;
    }

    const [nameX, nameY] = polar(middle, 216);
    const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    nameText.setAttribute('class', 'vgi-name');
    nameText.setAttribute('x', nameX);
    nameText.setAttribute('y', nameY + 4);
    nameText.textContent = name;
    labels.appendChild(nameText);
    angle = next;
  });
})();
</script>
