<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b3f53" flood-opacity=".16"/></filter>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#123b4a}.title{font-size:34px;font-weight:800}.sub{font-size:19px;fill:#46545b}.small{font-size:16px}.tiny{font-size:14px}.labelTitle{font-size:21px;font-weight:800}.labelText{font-size:16px;fill:#46545b}.num{font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.kicker{font-size:15px;font-weight:800;letter-spacing:2px;fill:#17647d}.siteH1{font-size:38px;font-weight:800;fill:#073f56}.siteH2{font-size:27px;font-weight:800;fill:#17647d}.line{fill:none;stroke:#c7952d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#cbd7dc;stroke-width:2}.hot{fill:none;stroke:#e0aa3e;stroke-width:3}.badge{fill:#e0aa3e;stroke:#fff;stroke-width:3}.searchTitle{font-size:22px;fill:#164da0}.link{fill:#164da0;text-decoration:underline}.danger{fill:#b33a2d;text-decoration:line-through}.labelBox{fill:#fff;stroke:#d4dde1;stroke-width:2}.goldBar{fill:#e0aa3e}.teal{fill:#0c4b61}.light{fill:#eef3f5}.muted{fill:#f7f8f8}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f6f7f7"/>
  <text x="960" y="60" text-anchor="middle" class="title" font-size="40">ON-PAGE SEO ELEMENTS</text>
  <text x="960" y="91" text-anchor="middle" class="sub">A static guide to the webpage elements that help users and search engines understand a page</text>

  <!-- central mock webpage -->
  <g filter="url(#shadow)">
    <rect x="420" y="120" width="1080" height="900" rx="20" class="box"/>
    <rect x="420" y="120" width="1080" height="70" rx="20" class="light"/>
    <circle cx="448" cy="155" r="8" fill="#c4cfd3"/><circle cx="472" cy="155" r="8" fill="#c4cfd3"/><circle cx="496" cy="155" r="8" fill="#c4cfd3"/>
    <rect x="525" y="137" width="720" height="38" rx="9" fill="#fff" stroke="#e0aa3e" stroke-width="3"/>
    <text x="545" y="162" class="small">https://trailwise.example/guides/<tspan font-weight="800">beginner-hiking-checklist</tspan></text>
    <text x="1405" y="163" class="small" font-weight="800">Trailwise</text>

    <rect x="420" y="190" width="1080" height="72" fill="#fff" stroke="#d4dde1"/>
    <rect x="455" y="207" width="40" height="40" rx="9" class="teal"/><text x="475" y="233" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">T</text>
    <text x="510" y="235" font-size="20" font-weight="800">TRAILWISE</text>
    <text x="1270" y="235" class="small" font-weight="700">Guides     Gear     Destinations</text>

    <text x="458" y="310" class="kicker">BEGINNER HIKING GUIDE</text>
    <rect x="455" y="328" width="1010" height="64" rx="9" class="hot"/>
    <text x="470" y="372" class="siteH1">Your First Hike: A Simple Trail Checklist</text>
    <rect x="455" y="394" width="1010" height="93" rx="9" class="hot"/>
    <text x="470" y="431" font-size="20">Pack smart, stay comfortable and enjoy the trail. This readable introduction uses clear</text>
    <text x="470" y="461" font-size="20">contrast and a mobile-friendly text size.</text>

    <rect x="455" y="515" width="220" height="182" rx="8" fill="#82bdcd" stroke="#e0aa3e" stroke-width="3"/>
    <path d="M470 683 L555 548 L635 683 Z" fill="#eaf1f2"/><path d="M500 683 L560 594 L625 683 Z" fill="#315e6c"/><circle cx="628" cy="555" r="24" fill="#fff3c8"/>
    <text x="705" y="550" class="siteH2">Build confidence before you go</text>
    <text x="705" y="600" font-size="20">Start with our </text><text x="830" y="600" font-size="20" class="link">beginner trail-planning guide</text><text x="1096" y="600" font-size="20"> and choose a route</text>
    <text x="705" y="630" font-size="20">that matches your experience.</text>
    <text x="705" y="675" font-size="20">Avoid dead ends such as this </text><text x="965" y="675" font-size="20" class="danger">outdated gear list</text><text x="1135" y="675" font-size="20">.</text>

    <rect x="455" y="735" width="1010" height="235" fill="#fff" stroke="#d4dde1"/>
    <rect x="455" y="735" width="1010" height="7" class="teal"/>
    <text x="485" y="780" class="kicker" fill="#59656a">SEARCH RESULT PREVIEW</text>
    <text x="485" y="815" class="tiny" fill="#26723b">trailwise.example › guides</text>
    <rect x="475" y="832" width="970" height="48" rx="7" class="hot"/>
    <text x="490" y="865" class="searchTitle">Beginner Hiking Checklist | Trailwise</text>
    <rect x="475" y="882" width="970" height="58" rx="7" class="hot"/>
    <text x="490" y="917" class="small">Plan your first hike with a simple checklist covering gear, safety, comfort and trail preparation.</text>
    <rect x="475" y="942" width="970" height="30" rx="7" fill="#eaf4f7" stroke="#e0aa3e" stroke-width="3"/>
    <text x="490" y="964" class="tiny" font-weight="800">✓ Article · How-to markup</text>
  </g>

  <!-- target badges -->
  <g><circle cx="1218" cy="156" r="17" class="badge"/><text x="1218" y="156" class="num">1</text>
  <circle cx="460" cy="344" r="17" class="badge"/><text x="460" y="344" class="num">2</text>
  <circle cx="460" cy="472" r="17" class="badge"/><text x="460" y="472" class="num">3</text>
  <circle cx="655" cy="536" r="17" class="badge"/><text x="655" y="536" class="num">4</text>
  <circle cx="1078" cy="584" r="17" class="badge"/><text x="1078" y="584" class="num">5</text>
  <circle cx="1127" cy="659" r="17" class="badge"/><text x="1127" y="659" class="num">6</text>
  <circle cx="1435" cy="842" r="17" class="badge"/><text x="1435" y="842" class="num">7</text>
  <circle cx="1435" cy="895" r="17" class="badge"/><text x="1435" y="895" class="num">8</text>
  <circle cx="1435" cy="957" r="17" class="badge"/><text x="1435" y="957" class="num">9</text></g>

  <!-- connector lines -->
  <path class="line" d="M1218 156 L1570 156"/>
  <path class="line" d="M460 344 L365 344 L365 250"/>
  <path class="line" d="M460 472 L335 472"/>
  <path class="line" d="M655 536 L385 536 L385 650"/>
  <path class="line" d="M1078 584 L1560 584"/>
  <path class="line" d="M1127 659 L1560 659"/>
  <path class="line" d="M1435 842 L1570 842"/>
  <path class="line" d="M1435 895 L1570 895"/>
  <path class="line" d="M1435 957 L1570 957"/>

  <!-- left callouts -->
  <g>
    <rect x="35" y="185" width="330" height="130" rx="12" class="labelBox"/><rect x="35" y="185" width="8" height="130" rx="4" class="goldBar"/>
    <circle cx="75" cy="225" r="20" class="teal"/><text x="75" y="225" class="num" fill="#fff">2</text><text x="110" y="232" class="labelTitle">Heading tags</text>
    <text x="65" y="270" class="labelText">Organize page topics into a</text><text x="65" y="293" class="labelText">clear, meaningful hierarchy.</text>

    <rect x="35" y="392" width="300" height="130" rx="12" class="labelBox"/><rect x="35" y="392" width="8" height="130" rx="4" class="goldBar"/>
    <circle cx="75" cy="432" r="20" class="teal"/><text x="75" y="432" class="num" fill="#fff">3</text><text x="110" y="439" class="labelTitle">Readable text</text>
    <text x="65" y="477" class="labelText">Use legible type, spacing,</text><text x="65" y="500" class="labelText">and strong color contrast.</text>

    <rect x="35" y="650" width="350" height="130" rx="12" class="labelBox"/><rect x="35" y="650" width="8" height="130" rx="4" class="goldBar"/>
    <circle cx="75" cy="690" r="20" class="teal"/><text x="75" y="690" class="num" fill="#fff">4</text><text x="110" y="697" class="labelTitle">Image alt text</text>
    <text x="65" y="735" class="labelText">Describe useful image content for</text><text x="65" y="758" class="labelText">screen readers and search engines.</text>
  </g>

  <!-- right callouts -->
  <g>
    <rect x="1570" y="110" width="315" height="115" rx="12" class="labelBox"/><rect x="1877" y="110" width="8" height="115" rx="4" class="goldBar"/>
    <circle cx="1610" cy="147" r="20" class="teal"/><text x="1610" y="147" class="num" fill="#fff">1</text><text x="1645" y="154" class="labelTitle">URL slug</text>
    <text x="1600" y="194" class="labelText">The readable, page-specific</text><text x="1600" y="216" class="labelText">ending of the URL.</text>

    <rect x="1560" y="525" width="325" height="105" rx="12" class="labelBox"/><rect x="1877" y="525" width="8" height="105" rx="4" class="goldBar"/>
    <circle cx="1600" cy="560" r="20" class="teal"/><text x="1600" y="560" class="num" fill="#fff">5</text><text x="1635" y="567" class="labelTitle">Anchor text</text>
    <text x="1590" y="608" class="labelText">Descriptive text used for a link.</text>

    <rect x="1560" y="642" width="325" height="105" rx="12" class="labelBox"/><rect x="1877" y="642" width="8" height="105" rx="4" class="goldBar"/>
    <circle cx="1600" cy="677" r="20" class="teal"/><text x="1600" y="677" class="num" fill="#fff">6</text><text x="1635" y="684" class="labelTitle">Broken links</text>
    <text x="1590" y="725" class="labelText">Repair links that lead to missing pages.</text>

    <rect x="1570" y="770" width="315" height="85" rx="12" class="labelBox"/><circle cx="1610" cy="803" r="20" class="teal"/><text x="1610" y="803" class="num" fill="#fff">7</text><text x="1645" y="810" class="labelTitle">Title tag</text><text x="1600" y="840" class="labelText">Search-result headline.</text>
    <rect x="1570" y="865" width="315" height="85" rx="12" class="labelBox"/><circle cx="1610" cy="898" r="20" class="teal"/><text x="1610" y="898" class="num" fill="#fff">8</text><text x="1645" y="905" class="labelTitle">Meta description</text><text x="1600" y="935" class="labelText">Concise search-result summary.</text>
    <rect x="1570" y="960" width="315" height="85" rx="12" class="labelBox"/><circle cx="1610" cy="993" r="20" class="teal"/><text x="1610" y="993" class="num" fill="#fff">9</text><text x="1645" y="1000" class="labelTitle">Schema markup</text><text x="1600" y="1030" class="labelText">Structured context for search engines.</text>
  </g>
</svg>
