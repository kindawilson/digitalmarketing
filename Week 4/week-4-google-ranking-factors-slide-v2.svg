<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#103c4c" flood-opacity=".13"/></filter>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#103f52}.title{font-size:52px;font-weight:800;letter-spacing:1px}.subtitle{font-size:24px;fill:#4c5a60}.factor{font-size:32px;font-weight:800}.desc{font-size:23px;fill:#44535a}.kicker{font-size:17px;font-weight:800;letter-spacing:2px;fill:#17647d}.num{font-size:31px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.box{fill:#fff;stroke:#d4dde1;stroke-width:2}.gold{fill:#e0aa3e}.teal{fill:#0c4b61}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f7f8f8"/>
  <text x="960" y="82" text-anchor="middle" class="title">HOW GOOGLE RANKS SEARCH RESULTS</text>
  <text x="960" y="125" text-anchor="middle" class="subtitle">Five key signals help Google decide which results may be the most relevant and useful</text>

  <g filter="url(#shadow)">
    <rect x="185" y="175" width="1550" height="150" rx="18" class="box"/><rect x="185" y="175" width="12" height="150" rx="6" class="gold"/>
    <circle cx="270" cy="250" r="42" class="teal"/><text x="270" y="250" class="num" style="fill:#fff">1</text>
    <text x="345" y="222" class="kicker">FACTOR 01</text><text x="345" y="270" class="factor">Meaning of your query</text>
    <text x="900" y="258" class="desc">Understands language, spelling, and search intent.</text>

    <rect x="185" y="345" width="1550" height="150" rx="18" class="box"/><rect x="185" y="345" width="12" height="150" rx="6" class="gold"/>
    <circle cx="270" cy="420" r="42" class="teal"/><text x="270" y="420" class="num" style="fill:#fff">2</text>
    <text x="345" y="392" class="kicker">FACTOR 02</text><text x="345" y="440" class="factor">Relevance of content</text>
    <text x="900" y="428" class="desc">Checks whether the page meaningfully answers the topic.</text>

    <rect x="185" y="515" width="1550" height="150" rx="18" class="box"/><rect x="185" y="515" width="12" height="150" rx="6" class="gold"/>
    <circle cx="270" cy="590" r="42" class="teal"/><text x="270" y="590" class="num" style="fill:#fff">3</text>
    <text x="345" y="562" class="kicker">FACTOR 03</text><text x="345" y="610" class="factor">Quality of content</text>
    <text x="900" y="598" class="desc">Looks for helpfulness, trust, expertise, and authority.</text>

    <rect x="185" y="685" width="1550" height="150" rx="18" class="box"/><rect x="185" y="685" width="12" height="150" rx="6" class="gold"/>
    <circle cx="270" cy="760" r="42" class="teal"/><text x="270" y="760" class="num" style="fill:#fff">4</text>
    <text x="345" y="732" class="kicker">FACTOR 04</text><text x="345" y="780" class="factor">Usability of content</text>
    <text x="900" y="768" class="desc">Considers accessibility, mobile experience, and speed.</text>

    <rect x="185" y="855" width="1550" height="150" rx="18" class="box"/><rect x="185" y="855" width="12" height="150" rx="6" class="gold"/>
    <circle cx="270" cy="930" r="42" class="teal"/><text x="270" y="930" class="num" style="fill:#fff">5</text>
    <text x="345" y="902" class="kicker">FACTOR 05</text><text x="345" y="950" class="factor">Context and settings</text>
    <text x="900" y="938" class="desc">Uses location, settings, and context when appropriate.</text>
  </g>

  <text x="1735" y="1045" text-anchor="end" font-size="17" fill="#526168">Source: Google — How Search Works</text>
</svg>
