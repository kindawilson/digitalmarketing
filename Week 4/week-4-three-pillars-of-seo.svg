<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="28" fill="#f5f6f7"/><rect width="1200" height="14" fill="#ddaf4b"/><text x="600" y="75" text-anchor="middle" font-family="Century Gothic,Arial" font-size="38" font-weight="700" fill="#0f3f52">THE THREE PILLARS OF SEO</text><g font-family="Lato,Arial"><rect x="45" y="115" width="340" height="300" rx="22" fill="#fff" stroke="#1d627b" stroke-width="5"/><circle cx="215" cy="180" r="38" fill="#0f3f52"/><text x="215" y="192" text-anchor="middle" font-size="36" font-weight="700" fill="#ddaf4b">1</text><text x="215" y="250" text-anchor="middle" font-size="27" font-weight="700" fill="#0f3f52">ON-PAGE SEO</text><text x="215" y="300" text-anchor="middle" font-size="19" fill="#4d5259"><tspan x="215">Content, keywords, HTML</tspan><tspan x="215" dy="30">and page experience</tspan></text><rect x="430" y="115" width="340" height="300" rx="22" fill="#fff" stroke="#1d627b" stroke-width="5"/><circle cx="600" cy="180" r="38" fill="#0f3f52"/><text x="600" y="192" text-anchor="middle" font-size="36" font-weight="700" fill="#ddaf4b">2</text><text x="600" y="250" text-anchor="middle" font-size="27" font-weight="700" fill="#0f3f52">OFF-PAGE SEO</text><text x="600" y="300" text-anchor="middle" font-size="19" fill="#4d5259"><tspan x="600">Backlinks, mentions,</tspan><tspan x="600" dy="30">social signals, and trust</tspan></text><rect x="815" y="115" width="340" height="300" rx="22" fill="#fff" stroke="#1d627b" stroke-width="5"/><circle cx="985" cy="180" r="38" fill="#0f3f52"/><text x="985" y="192" text-anchor="middle" font-size="36" font-weight="700" fill="#ddaf4b">3</text><text x="985" y="250" text-anchor="middle" font-size="27" font-weight="700" fill="#0f3f52">TECHNICAL SEO</text><text x="985" y="300" text-anchor="middle" font-size="19" fill="#4d5259"><tspan x="985">Crawling, indexing, speed,</tspan><tspan x="985" dy="30">mobile, and security</tspan></text></g></svg>